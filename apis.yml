aid: turntide-technologies
name: Turntide Technologies
description: 'Turntide Technologies is an electrification company that designs and manufactures
  axial flux electric motors, power electronics and inverters, modular battery energy storage,
  and thermal management systems for electric and hybrid platforms across agriculture, automotive,
  commercial vehicles, construction, gensets, industrial equipment, marine, rail and recreation.
  Founded in 2013 as Software Motor Corporation and rebranded to Turntide in 2020, the company
  grew through acquisitions including Riptide (building automation, 2021), Hyperdrive (batteries),
  AVID Technology (EV controls) and BorgWarner''s Gateshead drivetrain division. Turntide publishes
  no public developer API for its hardware products; the only machine-readable surfaces observed on
  its own hosts are the WordPress REST API at turntide.com/wp-json, the WordPress Abilities API, and
  an OAuth-protected MCP server advertised via RFC 8414 / RFC 9728 well-known metadata.'
