apis:
- name: Turntide WordPress REST API
  description: 'The WordPress REST API surface published by Turntide Technologies at
    turntide.com/wp-json — 274 routes across 14 namespaces including wp/v2 content collections
    (posts, pages, media, categories, tags, users, comments), the WordPress Abilities API
    (wp-abilities/v1) and an MCP adapter namespace (mcp). This is the corporate website''s
    content/CMS surface, not a product API for Turntide''s motor, power electronics, energy
    storage or thermal hardware — Turntide ships no public developer API for those products.
    The OpenAPI in this repo was derived mechanically from the live route index and from
    JSON Schemas returned by HTTP OPTIONS on the core wp/v2 collections.'
