format_note: >-
  Not RFC 9457. The WordPress REST API returns application/json with a {code, message, data}
  envelope rather than application/problem+json with type/title/detail. No operation in the
  derived spec declares application/problem+json.
envelope:
  content_type: application/json
  fields:
    code: machine-readable error slug
    message: human-readable message
    data.status: HTTP status code
    data.params: map of parameter name to validation message (validation errors only)
    data.details: map of parameter name to a nested {code, message, data} object (validation
      errors only)
  additional_errors: >-
    When more than one error occurred, WordPress returns data.additional_errors[] carrying the
    same envelope shape per error.
